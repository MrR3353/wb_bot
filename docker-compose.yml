services:
  db:
    image: postgres:14
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mynetwork
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    networks:
      - mynetwork
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: bot
    env_file:
      - .env
    depends_on:
      - app
    networks:
      - mynetwork
volumes:
  db_data:
networks:
  mynetwork:
    driver: bridge
